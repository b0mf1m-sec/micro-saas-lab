<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prospect Analyzer</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #f5f5f5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181b21;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: #181b21;
      border: 1px solid #2b2f37;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .metric {
      background: #101217;
      padding: 14px;
      border-radius: 8px;
    }

    .metric-label {
      color: #999;
      font-size: 13px;
    }

    .metric-value {
      font-size: 22px;
      margin-top: 5px;
      font-weight: bold;
    }

    .view-text {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #ddd;
    }

    .hidden {
      display: none;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    #error {
      background: #351717;
      border: 1px solid #7a2929;
    }

    .finding {
      padding: 12px;
      background: #101217;
      border-radius: 8px;
      margin-top: 10px;
    }

    .finding strong {
      display: block;
      margin-bottom: 5px;
    }

  </style>
</head>


<body>

  <div class="container">

    <h1>Prospect Analyzer</h1>

    <div class="subtitle">
      Turn verified website findings into personalized outreach.
    </div>


    <div class="search-box">

      <input
        id="urlInput"
        type="text"
        placeholder="example.com"
      >

      <button id="analyzeButton">
        Analyze
      </button>

    </div>


    <div
      id="loading"
      class="hidden"
    >
      Analyzing website...
    </div>


    <div
      id="error"
      class="card hidden"
    ></div>


    <div
      id="results"
      class="hidden"
    >


      <!-- PERFORMANCE -->

      <div class="card">

        <h2>Performance</h2>

        <div class="metrics">

          <div class="metric">
            <div class="metric-label">
              Score
            </div>

            <div
              class="metric-value"
              id="score"
            >
              -
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              LCP
            </div>

            <div
              class="metric-value"
              id="lcp"
            >
              -
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              CLS
            </div>

            <div
              class="metric-value"
              id="cls"
            >
              -
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              FCP
            </div>

            <div
              class="metric-value"
              id="fcp"
            >
              -
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              Speed Index
            </div>

            <div
              class="metric-value"
              id="speedIndex"
            >
              -
            </div>
          </div>

        </div>

      </div>


      <!-- SEO -->

      <div class="card">

        <h2>SEO Structure</h2>

        <p>
          <strong>Title:</strong>
          <span id="title"></span>
        </p>

        <p>
          <strong>Meta Description:</strong>
          <span id="metaDescription"></span>
        </p>

        <p>
          <strong>H1 Count:</strong>
          <span id="h1Count"></span>
        </p>

      </div>


      <!-- FINDINGS -->

      <div class="card">

        <h2>Verified Findings</h2>

        <div id="findings"></div>

      </div>


      <!-- AGENCY VIEW -->

      <div class="card">

        <h2>Agency View</h2>

        <div
          class="view-text"
          id="agencyView"
        ></div>

      </div>


      <!-- PROSPECT VIEW -->

      <div class="card">

        <h2>Prospect View</h2>

        <div
          class="view-text"
          id="prospectView"
        ></div>

      </div>

    </div>

  </div>


  <script>

    const urlInput =
      document.getElementById("urlInput");

    const analyzeButton =
      document.getElementById("analyzeButton");

    const loading =
      document.getElementById("loading");

    const results =
      document.getElementById("results");

    const errorBox =
      document.getElementById("error");


    async function analisar() {

      const url =
        urlInput.value.trim();


      if (!url) {

        alert(
          "Enter a website URL."
        );

        return;
      }


      loading.classList.remove(
        "hidden"
      );

      results.classList.add(
        "hidden"
      );

      errorBox.classList.add(
        "hidden"
      );

      analyzeButton.disabled =
        true;


      try {

        const resposta =
          await fetch(
            "/analisar",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url
                })
            }
          );


        const dados =
          await resposta.json();


        if (!resposta.ok) {

          throw new Error(
            dados.erro ||
            "Analysis failed."
          );
        }


        mostrarResultado(
          dados
        );

      } catch (erro) {

        errorBox.textContent =
          erro.message;

        errorBox.classList.remove(
          "hidden"
        );

      } finally {

        loading.classList.add(
          "hidden"
        );

        analyzeButton.disabled =
          false;
      }
    }


    function mostrarResultado(
      dados
    ) {

      // PERFORMANCE

      document.getElementById(
        "score"
      ).textContent =
        dados.performance?.score ?? "-";


      document.getElementById(
        "lcp"
      ).textContent =
        dados.performance?.lcp ?? "-";


      document.getElementById(
        "cls"
      ).textContent =
        dados.performance?.cls ?? "-";


      document.getElementById(
        "fcp"
      ).textContent =
        dados.performance?.fcp ?? "-";


      document.getElementById(
        "speedIndex"
      ).textContent =
        dados.performance?.speedIndex ?? "-";


      // SEO

      document.getElementById(
        "title"
      ).textContent =
        dados.seo?.title ?? "-";


      document.getElementById(
        "metaDescription"
      ).textContent =
        dados.seo?.metaDescription ?? "-";


      document.getElementById(
        "h1Count"
      ).textContent =
        dados.seo?.h1Count ?? "-";


      // FINDINGS

      const findingsContainer =
        document.getElementById(
          "findings"
        );


      findingsContainer.innerHTML =
        "";


      if (
        !dados.findings ||
        dados.findings.length === 0
      ) {

        findingsContainer.textContent =
          "No verified issues detected.";

      } else {

        dados.findings.forEach(
          finding => {

            const div =
              document.createElement(
                "div"
              );


            div.className =
              "finding";


            const titulo =
              document.createElement(
                "strong"
              );


            titulo.textContent =
              `${finding.codigo} — ${finding.severidade}`;


            const evidencia =
              document.createElement(
                "span"
              );


            evidencia.textContent =
              finding.evidencia;


            div.appendChild(
              titulo
            );


            div.appendChild(
              evidencia
            );


            findingsContainer.appendChild(
              div
            );
          }
        );
      }


      // AGENCY VIEW

      document.getElementById(
        "agencyView"
      ).textContent =
        dados.agencyView ||
        "No Agency View generated.";


      // PROSPECT VIEW

      document.getElementById(
        "prospectView"
      ).textContent =
        dados.prospectView ||
        "No Prospect View generated.";


      results.classList.remove(
        "hidden"
      );
    }


    analyzeButton.addEventListener(
      "click",
      analisar
    );


    urlInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          analisar();
        }
      }
    );

  </script>

</body>

</html>
